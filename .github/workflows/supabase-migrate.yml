# Auto-apply Supabase migrations on merge to main.
#
# Why: migrations under dashboard/supabase/migrations/ land in the repo but
# nobody currently runs them in prod. Phase 0.6 adds youtube_thumbnail_url
# column; Phase 4.4-4.6 add indexes + realtime publication change. Without
# this workflow, every migration is a manual remember-to-run step that
# silently breaks the code that depends on it.
#
# REQUIRED SECRETS (set in GitHub repo → Settings → Secrets and variables → Actions):
#   - SUPABASE_ACCESS_TOKEN — personal access token from
#     https://supabase.com/dashboard/account/tokens
#   - SUPABASE_PROJECT_REF — the project ref from supabase URL
#     (jswdfthmegjbhnwbgeca per repo config)
#   - SUPABASE_DB_PASSWORD — database password (Settings → Database → Password)
#
# Setup steps documented in docs/supabase-migrate-setup.md.
#
# Safety: this workflow ONLY runs migrations FORWARD. There is no auto-rollback.
# If a migration is bad: revert the migration file via a new PR with a
# corrective migration; never edit a migration that has already shipped.

name: Apply Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/supabase/migrations/**.sql'
  # Allow manual re-trigger in case a previous run failed and we want to retry.
  workflow_dispatch:

concurrency:
  group: supabase-migrate-prod
  cancel-in-progress: false   # never cancel an in-flight migration

jobs:
  migrate:
    name: supabase db push (prod)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production   # gate behind GitHub environment approval if you want manual gate
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to prod project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          cd dashboard
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} \
            --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Show pending migrations (dry-run)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          cd dashboard
          echo "::group::Pending migrations"
          supabase db push --dry-run --password "${{ secrets.SUPABASE_DB_PASSWORD }}"
          echo "::endgroup::"

      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          cd dashboard
          supabase db push --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Summarize
        if: success()
        run: |
          echo "Migration apply succeeded at $(date -u +%FT%TZ)" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure (placeholder)
        if: failure()
        run: |
          echo "Migration FAILED — manual intervention required." >> $GITHUB_STEP_SUMMARY
          echo "If a migration partially applied, the next push will retry the remainder." >> $GITHUB_STEP_SUMMARY
          # TODO: wire to Resend email or Slack webhook once those exist (Phase 5.6 timing)
