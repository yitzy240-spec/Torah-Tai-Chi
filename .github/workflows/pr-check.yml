# PR build + test gate for the Torah Tai Chi monorepo.
#
# Why: Vercel auto-deploys main. Before this workflow, a broken build would
# ship to prod and only be caught when the Vercel deploy errored — or worse,
# when a page 500'd at runtime. This gates merge-to-main on build + test
# passing for all three slices (dashboard, website, Python pipeline).
#
# Placeholder env vars are used for Next builds because the build needs
# certain NEXT_PUBLIC_* vars present (Supabase client is constructed at
# module load with `!` non-null assertion). Real secrets stay in Vercel +
# Modal; CI just needs valid-looking strings to pass compilation.

name: PR check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]   # also run on main itself so we know main is green

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    name: Dashboard (build + lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (non-blocking until existing errors cleaned up)
        # TODO: remove continue-on-error once dashboard lint is clean.
        # 7 pre-existing errors at workflow inception (2026-06-03):
        # cascading-render setState, react/no-unescaped-entities, refs-during-render,
        # no-html-link-for-pages. Track as Phase 1 cleanup item.
        continue-on-error: true
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests (node:test on lib/*.test.ts)
        run: |
          # Run every *.test.ts under src/lib. Add new test files here as they land.
          for f in src/lib/*.test.ts; do
            node --test --experimental-strip-types "$f" || exit 1
          done

      - name: Build
        env:
          # Placeholders — real values live in Vercel project env.
          # These satisfy the bang-asserted module-load reads in lib/supabase/*
          # and lib/storage-url.ts without revealing real credentials in CI.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder.placeholder
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder.placeholder
          NEXT_PUBLIC_SUPABASE_URL_HOST: placeholder.supabase.co
        run: npm run build

  website:
    name: Website (build + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (non-blocking until existing errors cleaned up)
        # TODO: remove continue-on-error once website lint is clean.
        # 1 pre-existing error + 4 warnings at workflow inception (2026-06-03).
        continue-on-error: true
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder.placeholder
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder.placeholder
        run: npm run build

  python:
    name: Python pipeline (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install ffmpeg (needed by stitcher + frame-extract tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # [dev] extras pulls in pytest + respx + pytest-asyncio (declared in pyproject.toml).
          pip install -e ".[dev]"

      - name: Run pytest
        env:
          # Tests should not need real credentials. If a test needs Supabase,
          # it should mock it. If it ACTUALLY needs to hit prod, mark it
          # @pytest.mark.integration and we'll skip it in CI.
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: placeholder
        run: pytest -q -m "not integration"

  hebcal-slug-mirror:
    name: hebcal-slug.ts mirror check (dashboard ↔ website)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Verify hebcal-slug.ts is byte-identical between apps
        # Background: 2026-06-01 "Korach instead of Beha'alotcha" incident.
        # The slug map drifted between dashboard and website, silently
        # routing the public site to the wrong parsha for any name containing
        # a curly apostrophe. The two files MUST match byte-for-byte (except
        # the leading filename comment); CI fails the PR otherwise.
        run: |
          # Strip the leading header comment block (both files start with a
          # `//`-comment block whose path/note differs) and diff the rest.
          # Awk: skip lines while still inside the leading `//` block; print
          # everything from the first non-`//` line onward.
          awk 'started || !/^[[:space:]]*\/\// {started=1; print}' dashboard/src/lib/hebcal-slug.ts > /tmp/dash-slug.ts
          awk 'started || !/^[[:space:]]*\/\// {started=1; print}' website/src/lib/hebcal-slug.ts > /tmp/web-slug.ts
          if ! diff -q /tmp/dash-slug.ts /tmp/web-slug.ts > /dev/null; then
            echo "::error::dashboard/src/lib/hebcal-slug.ts and website/src/lib/hebcal-slug.ts have diverged."
            echo "Mirror the dashboard file into the website (or vice versa) and commit."
            diff /tmp/dash-slug.ts /tmp/web-slug.ts || true
            exit 1
          fi
          echo "hebcal-slug.ts is in sync between dashboard and website."

  # Summary job that all PR-protection rules can require as a single check.
  ci-passed:
    name: CI passed
    needs: [dashboard, website, python, hebcal-slug-mirror]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          if [ "${{ needs.dashboard.result }}" != "success" ] || \
             [ "${{ needs.website.result }}" != "success" ] || \
             [ "${{ needs.python.result }}" != "success" ] || \
             [ "${{ needs.hebcal-slug-mirror.result }}" != "success" ]; then
            echo "One or more jobs failed."
            exit 1
          fi
          echo "All CI jobs passed."
