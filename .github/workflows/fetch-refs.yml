# Fetch Jewish-ritual reference photos from Wikimedia Commons on a GitHub
# runner — which has ordinary internet — and commit them to the branch.
#
# Why a workflow: the Claude Code environment that maintains the reference
# library sits behind an egress policy that blocks commons.wikimedia.org
# and upload.wikimedia.org, and every other image host that was tried
# (Openverse, Unsplash, Pexels, Flickr, the Met, the Smithsonian, LoC,
# archive.org). GitHub is the one door that policy leaves open, so the
# fetch runs here and the bytes travel back through git. Nobody has to run
# a script on their own machine, and the operator never sees any of this.
#
# Two ways to trigger it:
#
#   1. Push a change to .github/fetch-refs-request.txt on a feature branch.
#      The workflow reads mode / items / force from that file. This is how
#      the Claude Code environment drives it — its GitHub token can push
#      commits but is not allowed to dispatch workflows (403).
#   2. "Run workflow" in the Actions tab, for humans.
#
# Modes:
#   browse   list Commons categories with license verdicts   -> read the log
#   resolve  show metadata for specific File: titles          -> read the log
#   fetch    download slot=File:Title pairs into references/jewish/,
#            append SOURCES.md, mark the request done, commit to the branch
#   done     a fulfilled request; nothing happens
#
# Only `fetch` writes anything. The license gate in
# tools/fetch_jewish_refs.py refuses NonCommercial, NoDerivatives and any
# unrecognised license before a byte is saved, so a run can only ever add
# files that are safe to use. Commits made here use GITHUB_TOKEN, which
# does not re-trigger workflows, so a fetch cannot loop.
#
# Two guards, both learned on 2026-09-21 when merging PR #8 to main put the
# request file there as a NEW file — a push touching that path — and the
# workflow re-ran a fetch that had already been fulfilled on the branch,
# overwriting a normalised image with the raw original and duplicating its
# SOURCES.md entry:
#   * the push trigger ignores main. Refs are fetched on feature branches
#     and reach main by PR, never by a run on main itself.
#   * a successful fetch rewrites the request file to `mode: done` in the
#     same commit, so the request it carries is spent wherever the commit
#     travels.

name: Fetch reference images

on:
  push:
    branches-ignore: [main]
    paths:
      - '.github/fetch-refs-request.txt'
  workflow_dispatch:
    inputs:
      mode:
        description: browse | resolve | fetch
        required: true
        type: choice
        options: [browse, resolve, fetch]
      items:
        description: >-
          Semicolon-separated. browse: category names. resolve: File: titles.
          fetch: slot=File:Title pairs (slots are defined in tools/fetch_jewish_refs.py).
        required: true
        type: string
      force:
        description: fetch only — replace a file that already exists
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fetch-refs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install --quiet httpx

      - name: Run fetcher
        env:
          # Empty on a push event; then the request file is the source.
          IN_MODE: ${{ inputs.mode }}
          IN_ITEMS: ${{ inputs.items }}
          IN_FORCE: ${{ inputs.force }}
        run: |
          python - <<'PY'
          import os, re, sys
          from pathlib import Path
          sys.path.insert(0, ".")
          from tools.fetch_jewish_refs import main

          mode = os.environ.get("IN_MODE", "").strip()
          items_raw = os.environ.get("IN_ITEMS", "")
          force_raw = os.environ.get("IN_FORCE", "false")
          from_file = False

          if not mode:
              from_file = True
              req = Path(".github/fetch-refs-request.txt")
              fields = {}
              for line in req.read_text(encoding="utf-8").splitlines():
                  line = line.strip()
                  if not line or line.startswith("#") or ":" not in line:
                      continue
                  k, v = line.split(":", 1)
                  # Inline comments: the commit step itself writes
                  # `mode: done  # fulfilled by run ...`. A comment is
                  # whitespace, "#", whitespace — so "File:Ark #2.jpg"
                  # keeps its "#2" and only " # fulfilled" is dropped.
                  fields[k.strip().lower()] = re.split(r"\s+#\s", v, 1)[0].strip()
              mode = fields.get("mode", "")
              items_raw = fields.get("items", "")
              force_raw = fields.get("force", "false")
              print(f"request file: mode={mode!r} force={force_raw!r}")

          items = [s.strip() for s in items_raw.split(";") if s.strip()]
          force = force_raw.strip().lower() == "true"

          # Tell the commit step what happened.
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write(f"MODE={mode}\n")
              fh.write(f"FROM_FILE={'true' if from_file else 'false'}\n")
              fh.write(f"ITEMS={items_raw.replace(chr(10), ' ')}\n")

          if mode == "done":
              print("request already fulfilled — nothing to do")
              sys.exit(0)
          if not mode or not items:
              print("request has no mode or no items — nothing to do")
              sys.exit(0)

          if mode == "browse":
              # An empty category returns 1 from the tool; that's information,
              # not a failure. Only a network error (3) should go red.
              worst = 0
              for cat in items:
                  print("=" * 78)
                  print(cat)
                  print("=" * 78)
                  worst = max(worst, main(["--browse", cat, "--limit", "80"]))
                  print()
              sys.exit(worst if worst >= 3 else 0)
          elif mode == "resolve":
              sys.exit(main(["--resolve", *items]))
          elif mode == "fetch":
              sys.exit(main(["--fetch", *items] + (["--force"] if force else [])))
          else:
              print(f"unknown mode {mode!r}")
              sys.exit(2)
          PY

      # `success() &&` is load-bearing: a bare `if:` replaces the implicit
      # success() condition, and this step must never commit after a fetch
      # that failed part-way.
      - name: Mark the request spent and commit fetched images
        if: success() && env.MODE == 'fetch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$FROM_FILE" = "true" ]; then
            sed -i "s/^mode: fetch\$/mode: done  # fulfilled by run ${GITHUB_RUN_ID} on $(date -u +%Y-%m-%d)/" .github/fetch-refs-request.txt
            git add .github/fetch-refs-request.txt
          fi
          git add references/jewish/
          if git diff --cached --quiet; then
            echo "nothing fetched — nothing to commit"
            exit 0
          fi
          git commit \
            -m "refs: fetch reference images from Wikimedia Commons" \
            -m "Fetched by the fetch-refs workflow. License verified against the Commons API at download time; see references/jewish/SOURCES.md for each file's source, license and author." \
            -m "Items: ${ITEMS}"
          git push
